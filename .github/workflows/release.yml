name: Publish versioned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing VERSION value to publish (for example 0.23.0)'
        required: true
        type: string
      release_type:
        description: 'Distribution channel (stable requires explicit owner approval)'
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - stable
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, tag and publish
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate requested version and provenance
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type || 'prerelease' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'VERSION must contain strict stable SemVer (MAJOR.MINOR.PATCH)' >&2
            exit 1
          fi
          tag="v${version}"
          # Tag pushes are always prerelease by default. The only way to
          # publish a stable 0.x GitHub Release is an explicit manual dispatch.
          if [[ "$RELEASE_TYPE" != 'prerelease' && "$RELEASE_TYPE" != 'stable' ]]; then
            echo 'Release type must be prerelease or stable' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' && "$RELEASE_TYPE" != 'prerelease' ]]; then
            echo 'A stable release requires an explicit manual main-branch run' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
              echo 'Run manual releases from the main branch only' >&2
              exit 1
            fi
            if [[ "$REQUESTED_VERSION" != "$version" ]]; then
              echo "Requested version $REQUESTED_VERSION differs from VERSION $version" >&2
              exit 1
            fi
          else
            if [[ "$GITHUB_REF" != "refs/tags/$tag" ]]; then
              echo "Tag $GITHUB_REF does not match VERSION $version" >&2
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo 'Tagged commit is not present on main' >&2
              exit 1
            fi
          fi
          echo "ORBIT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ORBIT_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ORBIT_RELEASE_TYPE=$RELEASE_TYPE" >> "$GITHUB_ENV"
      - name: Prepare versioned candidate bundle from canonical runtime
        run: python scripts/prepare_release_candidate.py
      - name: Enforce reusable public release readiness checks
        run: python scripts/check_release_readiness.py
      - name: Compile code
        run: python -m compileall -q source installer.py scripts tests
      - name: Run unit and MCP protocol tests
        run: python -m unittest discover -s tests -v
      - name: Verify consistent package versions
        run: python scripts/check_version.py --strict-bundle
      - name: Build and verify reproducible release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py --verify
          (cd dist && sha256sum --check "ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip.sha256")
          (cd dist && sha256sum --check "Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip.sha256")
          (cd dist && sha256sum --check "Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip.sha256")
      - name: Generate version-specific release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ['ORBIT_RELEASE_VERSION']
          notes = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'(?ms)^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', notes)
          if not match:
              raise SystemExit(f'CHANGELOG.md must contain a ## [{version}] entry')
          content = f'## ORBIT Core MCP v{version}\n\n' + match.group(1).strip() + '\n\n'
          content += 'Built from a tested commit on the `main` branch. Read `SECURITY.md` and `README.md` before installing. Local MCP and agent integrations require host-specific setup.\n'
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(content, encoding='utf-8')
          PY
      - name: Confirm tag is immutable or create it
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$ORBIT_RELEASE_TAG"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/$ORBIT_RELEASE_TAG")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $ORBIT_RELEASE_TAG points to another commit; refusing to move it" >&2
              exit 1
            fi
            echo 'Existing tag matches this commit; reusing it'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$ORBIT_RELEASE_TAG" -m "ORBIT Core MCP $ORBIT_RELEASE_TAG"
            git push origin "refs/tags/$ORBIT_RELEASE_TAG"
          fi
      - name: Add checksum for desktop extension
        shell: bash
        run: |
          sha256sum "ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb" > "dist/ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb.sha256"
      - name: Publish GitHub Release with installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never mark an incompatible existing publication as a successful
            # stable release. A prerelease cannot be silently promoted.
            existing_draft="$(gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            existing_prerelease="$(gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            expected_prerelease=true
            if [[ "$ORBIT_RELEASE_TYPE" == 'stable' ]]; then expected_prerelease=false; fi
            if [[ "$existing_draft" == 'true' ]]; then
              # A draft can be recovered only by an owner-authorized manual
              # dispatch on main. Tag pushes cannot promote existing drafts.
              if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
                echo "Existing draft requires an explicit manual main-branch release" >&2
                exit 1
              fi
              existing_body="$(gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
              if ! grep -Fq -- "## ORBIT Core MCP v${ORBIT_RELEASE_VERSION}" <<< "$existing_body"; then
                echo "Existing draft notes do not identify the requested version; manual review required" >&2
                exit 1
              fi
              draft_assets="$RUNNER_TEMP/orbit-draft-assets.json"
              gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$draft_assets"
              draft_state="$(python scripts/verify_release_draft_assets.py --version "$ORBIT_RELEASE_VERSION" --assets-json "$draft_assets" --allow-empty)"
              if [[ "$draft_state" == 'EMPTY' ]]; then
                # No --clobber: partial drafts fail closed. Upload only when
                # every requested asset is currently absent.
                gh release upload "$ORBIT_RELEASE_TAG" \
                  "dist/ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip" \
                  "dist/ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip.sha256" \
                  "dist/Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip" \
                  "dist/Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip.sha256" \
                  "dist/Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip" \
                  "dist/Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip.sha256" \
                  "ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb" \
                  "dist/ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb.sha256" \
                  --repo "$GITHUB_REPOSITORY"
              fi
              gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$draft_assets"
              verified="$(python scripts/verify_release_draft_assets.py --version "$ORBIT_RELEASE_VERSION" --assets-json "$draft_assets")"
              if [[ "$verified" != 'COMPLETE' ]]; then
                echo "Existing draft integrity verification failed; leaving unpublished" >&2
                exit 1
              fi
              gh release edit "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$expected_prerelease"
              published_draft="$(gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
              published_channel="$(gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
              if [[ "$published_draft" != 'false' || "$published_channel" != "$expected_prerelease" ]]; then
                echo "Release state after draft recovery did not match approval" >&2
                exit 1
              fi
              gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$draft_assets"
              python scripts/verify_release_draft_assets.py --version "$ORBIT_RELEASE_VERSION" --assets-json "$draft_assets"
              echo "Recovered and published exact verified draft $ORBIT_RELEASE_TAG"
              exit 0
            fi
            if [[ "$existing_draft" != 'false' || "$existing_prerelease" != "$expected_prerelease" ]]; then
              echo "Existing release $ORBIT_RELEASE_TAG has incompatible draft/channel state; refusing success" >&2
              exit 1
            fi
            # Reusing a same-channel release is idempotent only when the
            # complete eight-asset inventory is still present.
            existing_assets="$(gh release view "$ORBIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for asset in               "ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip"               "ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip.sha256"               "Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip"               "Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip.sha256"               "Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip"               "Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip.sha256"               "ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb"               "ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb.sha256"; do
              if ! grep -Fxq -- "$asset" <<< "$existing_assets"; then
                echo "Existing release $ORBIT_RELEASE_TAG is missing expected asset $asset" >&2
                exit 1
              fi
            done
            echo "Existing release $ORBIT_RELEASE_TAG matches channel and eight assets; leaving unchanged"
            exit 0
          fi
          flags=()
          # "stable" describes the approved GitHub distribution channel,
          # not an assurance of SemVer API compatibility for version 0.x.
          # Never infer a stable publication from a tag push or version number.
          if [[ "$ORBIT_RELEASE_TYPE" == 'prerelease' ]]; then flags+=(--prerelease); fi
          gh release create "$ORBIT_RELEASE_TAG" \
            "dist/ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip" \
            "dist/ORBIT-Universal-Setup-v${ORBIT_RELEASE_VERSION}.zip.sha256" \
            "dist/Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip" \
            "dist/Orbit-Antigravity-Plugin-v${ORBIT_RELEASE_VERSION}.zip.sha256" \
            "dist/Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip" \
            "dist/Orbit-Core-Plugin-Suite-v${ORBIT_RELEASE_VERSION}.zip.sha256" \
            "ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb" \
            "dist/ORBIT-Claude-Desktop-v${ORBIT_RELEASE_VERSION}.mcpb.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ORBIT Core MCP v${ORBIT_RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"