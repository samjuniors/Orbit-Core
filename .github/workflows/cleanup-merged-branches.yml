name: One-time cleanup of verified merged PR branches

on:
  push:
    branches: [main]
    # One-time trigger: adding this pinned audit manifest to main.
    paths:
      - '.github/merged-branch-cleanup-2026-10-27.json'
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Type DELETE_VERIFIED_MERGED_BRANCHES to run the same pinned cleanup manually'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orbit-verified-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'samjuniors/Orbit-Core-MCP' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_delete == 'DELETE_VERIFIED_MERGED_BRANCHES')
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned manifest and audit script
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate heads and merged PRs (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prune_merged_branches.py --manifest .github/merged-branch-cleanup-2026-10-27.json
      - name: Delete only unchanged verified merged refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prune_merged_branches.py --manifest .github/merged-branch-cleanup-2026-10-27.json --apply
