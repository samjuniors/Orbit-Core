name: One-time cleanup of merged update-manager branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-update-branch.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'samjuniors/Orbit-Core-MCP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the exact merged PR 14 head when unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="samjuniors/Orbit-Core-MCP"
          branch="feat/update-notifications-manager"
          expected="5a303c623037afbecfce7c3498c7c26b34e51161"
          pr="$(gh api "repos/$repo/pulls/14")"
          merged_at="$(jq -r '.merged_at // empty' <<< "$pr")"
          pr_head="$(jq -r '.head.sha' <<< "$pr")"
          pr_name="$(jq -r '.head.ref' <<< "$pr")"
          pr_base="$(jq -r '.base.ref' <<< "$pr")"
          if [[ -z "$merged_at" || "$pr_name" != "$branch" || "$pr_base" != "main" || "$pr_head" != "$expected" ]]; then
            echo "PR #14 is not the expected merged PR; preserving the branch" >&2
            exit 1
          fi
          ref="$(gh api "repos/$repo/git/ref/heads/$branch" 2>/dev/null)" || {
            echo "Already deleted or inaccessible; no deletion attempted"
            exit 0
          }
          actual="$(jq -r '.object.sha' <<< "$ref")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch changed since merge; preserving it" >&2
            exit 1
          fi
          gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          echo "Deleted only verified merged branch $branch at $expected"
