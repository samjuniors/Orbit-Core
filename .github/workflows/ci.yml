name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare reproducible desktop bundle for current source version
        run: python scripts/prepare_release_candidate.py
      - name: Compile Python sources
        run: python -m compileall -q source installer.py scripts tests
      - name: Unit and MCP protocol tests
        run: python -m unittest discover -s tests -v
      - name: Version consistency
        run: python scripts/check_version.py
      - name: Rebuild ZIP and check layout
        run: python scripts/build_release.py --verify
      - name: Smoke-test extracted release ZIP and disposable installed MCP
        run: python scripts/smoke_release_zip.py
      - name: Check out immutable v0.24.1 source for disposable upgrade test
        if: matrix.python-version == '3.12'
        uses: actions/checkout@v4
        with:
          ref: v0.24.1
          path: previous-0.24.1
      - name: Rehearse existing v0.24.1 installation upgrade without user data loss
        if: matrix.python-version == '3.12'
        run: python scripts/smoke_upgrade_previous.py --previous-root previous-0.24.1
      - name: Strict source and desktop bundle parity for release candidate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_version.py --strict-bundle
      - name: Upload non-published candidate installers for host acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && (github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/'))
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v0.25.1-host-acceptance
          path: |
            ORBIT-Claude-Desktop-v0.25.1.mcpb
            dist/ORBIT-Universal-Setup-v0.25.1.zip
            dist/ORBIT-Universal-Setup-v0.25.1.zip.sha256
          if-no-files-found: error
          retention-days: 14
