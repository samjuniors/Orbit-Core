name: One-time removal of merged v0.25.0 release branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-pr12.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'samjuniors/Orbit-Core-MCP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify merge and exact expected branch head before deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="samjuniors/Orbit-Core-MCP"
          branch="release/v0.25.0-candidate"
          expected="4274a9ccb81a0bd0b4a3977d481069b0e419c036"
          pr="$(gh api "repos/$repo/pulls/12")"
          merged_at="$(jq -r '.merged_at // empty' <<< "$pr")"
          pr_head="$(jq -r '.head.sha' <<< "$pr")"
          pr_name="$(jq -r '.head.ref' <<< "$pr")"
          pr_base="$(jq -r '.base.ref' <<< "$pr")"
          if [[ -z "$merged_at" || "$pr_name" != "$branch" || "$pr_base" != "main" || "$pr_head" != "$expected" ]]; then
            echo "PR #12 is not the exact merged PR expected; preserving branch" >&2
            exit 1
          fi
          ref="$(gh api "repos/$repo/git/ref/heads/$branch" 2>/dev/null)" || {
            echo "Already deleted or inaccessible; no branch deletion attempted"
            exit 0
          }
          actual="$(jq -r '.object.sha' <<< "$ref")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch moved since review; preserving it" >&2
            exit 1
          fi
          gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          echo "Deleted only verified merged branch: $branch ($expected)"
